name: Generate Release Keystore (RUN ONCE ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Eagle Sports,O=Eagle,C=SA"
          base64 -w0 release.jks > keystore_base64.txt
          {
            echo "STORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
          } > passwords.txt

      - name: Upload (kept 1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-SAVE-THEN-DELETE
          path: |
            release.jks
            keystore_base64.txt
            passwords.txt
          retention-days: 1
          if-no-files-found: error
